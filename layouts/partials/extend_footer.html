<script src="
https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js
"></script>

<script>
const images = Array.from(document.querySelectorAll(".post-content img"));
images.forEach(img => {
  mediumZoom(img, {
    margin: 5, /* The space outside the zoomed image */
    background: '#15161e',
    scrollOffset: 40, /* The number of pixels to scroll to close the zoom */
    container: null, /* The viewport to render the zoom in */
    template: null, /* The template element to display on zoom */
  });
});
</script>

<script id="mermaid-loader" type="module" data-url="{{ site.Params.mermaidUrl }}">
  if (document.querySelector(".mermaid")) {
    const loader = document.querySelector("#mermaid-loader");
    const mermaid = await import(loader.dataset.url);
    mermaid.default.initialize({
      startOnLoad: true,
      securityLevel: "strict",
      theme: document.documentElement.dataset.theme === "dark" ? "dark" : "default"
    });
  }
</script>
