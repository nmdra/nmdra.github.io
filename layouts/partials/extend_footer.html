<script src="
https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js
"></script>

<script>
const images = Array.from(document.querySelectorAll(".post-content img"));
images.forEach(img => {
  mediumZoom(img, {
    margin: 5, /* The space outside the zoomed image */
    background: '#15161e',
    scrollOffset: 40, /* The number of pixels to scroll to close the zoom */
    container: null, /* The viewport to render the zoom in */
    template: null, /* The template element to display on zoom */
  });
});
</script>

<script id="pele-loader" type="module" data-url="{{ site.Params.peleUrl }}">
  const diagrams = document.querySelectorAll(".mermaid");
  if (diagrams.length) {
    try {
      const loader = document.querySelector("#pele-loader");
      const { mount } = await import(loader.dataset.url);
      const [
        { icon: renderFaIcon },
        solidIcons,
        regularIcons,
        brandIcons
      ] = await Promise.all([
        import("https://esm.sh/@fortawesome/fontawesome-svg-core@7.3.1"),
        import("https://esm.sh/@fortawesome/free-solid-svg-icons@7.3.1"),
        import("https://esm.sh/@fortawesome/free-regular-svg-icons@7.3.1"),
        import("https://esm.sh/@fortawesome/free-brands-svg-icons@7.3.1")
      ]);

      const iconPacks = {
        fa: solidIcons,
        fas: solidIcons,
        far: regularIcons,
        fab: brandIcons
      };

      const icons = (name) => {
        const match = /^(fa|fas|far|fab):fa-([a-z0-9-]+)$/.exec(name);

        if (!match) return null;

        const [, prefix, iconName] = match;
        const exportName = "fa" + iconName
          .split("-")
          .map(part => part.charAt(0).toUpperCase() + part.slice(1))
          .join("");

        const definition = iconPacks[prefix][exportName];

        return definition
          ? renderFaIcon(definition).html.join("")
          : null;
      };

      for (const element of diagrams) {
        mount(element, element.textContent, {
          links: true,
          images: true,
          icons,
          zoom: true
        });
      }
    } catch (error) {
      console.error("Unable to load Pele diagrams.", error);
      for (const element of diagrams) {
        const message = document.createElement("p");
        message.className = "mermaid-error";
        message.setAttribute("role", "status");
        message.textContent = "Diagram rendering is unavailable. Source is shown below.";
        element.prepend(message);
      }
    }
  }
</script>
