<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Traditional caching: cache-aside architecture</title>
  <desc id="desc">The client checks the cache first. On a hit the stored response is returned. On a miss the backend fetches from the database, stores the result in the cache, and returns it.</desc>

  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    @keyframes flow {
      to { stroke-dashoffset: -14; }
    }
    .flow {
      stroke-dasharray: 7 7;
      animation: flow 0.9s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; }
    }
  </style>

  <rect x="0" y="0" width="1200" height="500" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="60" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Traditional caching: cache-aside</text>
  <text x="60" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#64748b">The cache sits between the API and the data source - a hit skips the database entirely.</text>

  <!-- ================= CLIENT ================= -->
  <rect x="70" y="170" width="260" height="110" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="213" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#1d4ed8">CLIENT / API</text>
  <text x="200" y="238" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1e293b">sends a request</text>
  <text x="200" y="258" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1e293b">returns the response</text>

  <!-- ================= CACHE (Redis) ================= -->
  <g>
    <path d="M470,170 L470,280 A130,14 0 0 0 730,280 L730,170 A130,14 0 0 1 470,170 Z" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <path d="M472,190 L728,190" stroke="#f97316" stroke-width="1" opacity="0.3"/>
    <text x="600" y="207" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9a3412">CACHE (REDIS)</text>
    <text x="600" y="231" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#7c2d12">stores the response</text>
    <text x="600" y="251" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#7c2d12">LRU + TTL eviction</text>
  </g>

  <!-- ================= DATABASE ================= -->
  <g>
    <path d="M900,170 L900,280 A130,14 0 0 0 1160,280 L1160,170 A130,14 0 0 1 900,170 Z" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M902,190 L1158,190" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
    <text x="1030" y="207" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#4338ca">DATABASE</text>
    <text x="1030" y="231" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#3730a3">source of truth</text>
    <text x="1030" y="251" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#3730a3">queried only on miss</text>
  </g>

  <!-- ================= FLOWS ================= -->
  <!-- 1. Request -->
  <line class="flow" x1="330" y1="200" x2="462" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="396" y="188" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">1. request</text>

  <!-- 2. Cache hit -->
  <line class="flow" x1="470" y1="248" x2="338" y2="248" stroke="#16a34a" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="404" y="266" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#15803d">cache hit - return stored response</text>

  <!-- 3. Cache miss: fetch from database -->
  <path class="flow" d="M600,285 C 600,420 1030,420 1030,285" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrGray)"/>
  <text x="815" y="442" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">2. cache miss - fetch from database</text>

  <!-- 4. Store result in cache -->
  <path class="flow" d="M1030,170 C 1030,95 600,95 600,170" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrGreen)"/>
  <text x="815" y="82" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#15803d">3. store result in cache</text>
</svg>
