<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 790" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Jev incident triage</title>
  <desc id="desc">A CloudWatch checkout alert goes to Jev for three illustrative decisions. The workflow pages on-call, asks a human to confirm ownership because confidence is 0.76, and opens a major incident. An incident agent then investigates.</desc>
  <style>
    svg { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .canvas { fill: #ffffff; stroke: #e4e7ec; }
    .card, .decisions, .action, .agent { fill: #ffffff; stroke: #cbd5df; }
    .jev { fill: #ffffff; stroke: #2563c5; stroke-width: 2; }
    .review { fill: #ffffff; stroke: #ad7b3f; }
    .ink { fill: #1d2939; }
    .muted { fill: #475467; }
    .accent { fill: #175cd3; }
    .rule { stroke: #e4e7ec; }
    .flow { fill: none; stroke: #667085; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .signal { fill: #175cd3; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
    .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
    .label { font-size: 22px; font-weight: 600; }
    .detail { font-size: 18px; }
    .node { font-size: 20px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#667085" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="canvas" x="1" y="1" width="718" height="788"/>
  <text class="eyebrow muted" x="48" y="51">INCIDENT TRIAGE</text>

  <rect class="card" x="140" y="80" width="440" height="78" rx="8"/>
  <text class="label ink" x="360" y="113" text-anchor="middle">CloudWatch alarm</text>
  <text class="detail muted" x="360" y="139" text-anchor="middle">Checkout 5xx in production</text>
  <path class="flow" d="M360 158 V201"/>
  <circle class="signal" r="3.5" opacity="0">
    <animateMotion path="M360 158 V201" dur="5s" keyTimes="0;0.4;1" keyPoints="0;1;1" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0;0" keyTimes="0;0.04;0.35;0.42;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <rect class="jev" x="140" y="210" width="440" height="116" rx="8"/>
  <text class="ink" x="360" y="259" text-anchor="middle" font-size="32" font-weight="750">Jev</text>
  <text class="detail accent" x="360" y="293" text-anchor="middle">Bounded probabilistic decisions</text>
  <path class="flow" d="M360 326 V370"/>
  <circle class="signal" r="3.5" opacity="0">
    <animateMotion path="M360 326 V370" begin="1.2s" dur="5s" keyTimes="0;0.4;1" keyPoints="0;1;1" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0;0" keyTimes="0;0.04;0.35;0.42;1" begin="1.2s" dur="5s" repeatCount="indefinite"/>
  </circle>

  <rect class="decisions" x="48" y="380" width="624" height="268" rx="8"/>
  <text class="eyebrow muted" x="72" y="412">JEV OUTPUT</text>
  <text class="eyebrow muted" x="397" y="412">WORKFLOW ACTION</text>
  <path class="rule" d="M72 425 H648 M72 497 H648 M72 567 H648"/>

  <text class="node ink" x="72" y="456">Page now</text>
  <text class="detail muted" x="72" y="480">Yes · 0.95</text>
  <path class="flow" d="M334 461 H380"/>
  <rect class="action" x="391" y="439" width="257" height="48" rx="9"/>
  <text class="node ink" x="519.5" y="470" text-anchor="middle">Page on-call</text>

  <text class="node ink" x="72" y="528">Owner</text>
  <text class="detail muted" x="72" y="552">Checkout · 0.76 confidence</text>
  <path class="flow" d="M334 531 H380"/>
  <rect class="review" x="391" y="509" width="257" height="48" rx="9"/>
  <text class="node ink" x="519.5" y="540" text-anchor="middle">Human confirms owner</text>

  <text class="node ink" x="72" y="598">Severity</text>
  <text class="detail muted" x="72" y="622">Major · score 2</text>
  <path class="flow" d="M334 601 H380"/>
  <rect class="action" x="391" y="579" width="257" height="48" rx="9"/>
  <text class="node ink" x="519.5" y="610" text-anchor="middle">Open incident</text>

  <path class="flow" d="M519.5 627 V681"/>
  <circle class="signal" r="3.5" opacity="0">
    <animateMotion path="M519.5 627 V681" begin="2.4s" dur="5s" keyTimes="0;0.4;1" keyPoints="0;1;1" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0;0" keyTimes="0;0.04;0.35;0.42;1" begin="2.4s" dur="5s" repeatCount="indefinite"/>
  </circle>
  <rect class="agent" x="391" y="690" width="257" height="73" rx="8"/>
  <text class="node ink" x="519.5" y="720" text-anchor="middle">Incident agent</text>
  <text class="detail muted" x="519.5" y="744" text-anchor="middle">Investigate · RCA · fix</text>
</svg>
