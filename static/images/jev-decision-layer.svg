<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Jev interface: inputs and outputs</title>
  <desc id="desc">State and questions are inputs to Jev. Jev returns typed decisions and probabilities.</desc>
  <style>
    svg { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .canvas { fill: #ffffff; stroke: #e4e7ec; }
    .card { fill: #ffffff; stroke: #cbd5df; }
    .jev { fill: #ffffff; stroke: #2563c5; stroke-width: 2; }
    .ink { fill: #1d2939; }
    .muted { fill: #475467; }
    .accent { fill: #175cd3; }
    .rail { fill: none; stroke: #667085; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: #667085; stroke-width: 1.8; stroke-linecap: round; marker-end: url(#arrow); }
    .signal { fill: #175cd3; pointer-events: none; }
    .pulse { fill: none; stroke: #175cd3; stroke-width: 2; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { .signal, .pulse { display: none; } }
    .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
    .label { font-size: 23px; font-weight: 600; }
    .detail { font-size: 17px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#667085" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="canvas" x="1" y="1" width="718" height="468"/>
  <text class="eyebrow muted" x="48" y="48">JEV INTERFACE</text>

  <rect class="card" x="56" y="82" width="250" height="72" rx="8"/>
  <text class="label ink" x="181" y="113" text-anchor="middle">State</text>
  <text class="detail muted" x="181" y="139" text-anchor="middle">Content + supporting facts</text>
  <rect class="card" x="414" y="82" width="250" height="72" rx="8"/>
  <text class="label ink" x="539" y="113" text-anchor="middle">Questions</text>
  <text class="detail muted" x="539" y="139" text-anchor="middle">Judgments to evaluate</text>

  <path class="rail" d="M181 154 V182 H539 V154"/>
  <path class="flow" d="M360 182 V219"/>
  <circle class="signal" r="3.5" opacity="0">
    <animateMotion path="M360 182 V219" dur="5s" keyTimes="0;0.15;1" keyPoints="0;1;1" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0;0" keyTimes="0;0.02;0.13;0.18;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <rect class="jev" x="240" y="229" width="240" height="78" rx="8"/>
  <rect class="pulse" x="235" y="224" width="250" height="88" rx="12" opacity="0">
    <animate attributeName="opacity" values="0;0;0.65;0;0" keyTimes="0;0.18;0.26;0.42;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="235;235;229;223;223" keyTimes="0;0.18;0.26;0.42;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="y" values="224;224;218;212;212" keyTimes="0;0.18;0.26;0.42;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="250;250;262;274;274" keyTimes="0;0.18;0.26;0.42;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="height" values="88;88;100;112;112" keyTimes="0;0.18;0.26;0.42;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text class="ink" x="360" y="278" text-anchor="middle" font-size="30" font-weight="700">Jev</text>

  <path class="rail" d="M360 307 V340 H181 M360 340 H539"/>
  <path class="flow" d="M181 340 V369"/>
  <path class="flow" d="M539 340 V369"/>
  <circle class="signal" r="3.5" opacity="0">
    <animateMotion path="M360 307 V340 H181 V369" begin="1.2s" dur="5s" keyTimes="0;0.4;1" keyPoints="0;1;1" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0;0" keyTimes="0;0.04;0.35;0.42;1" begin="1.2s" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle class="signal" r="3.5" opacity="0">
    <animateMotion path="M360 307 V340 H539 V369" begin="1.2s" dur="5s" keyTimes="0;0.4;1" keyPoints="0;1;1" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0;0" keyTimes="0;0.04;0.35;0.42;1" begin="1.2s" dur="5s" repeatCount="indefinite"/>
  </circle>
  <rect class="card" x="56" y="379" width="250" height="64" rx="8"/>
  <text class="label ink" x="181" y="418" text-anchor="middle">Typed decisions</text>
  <rect class="card" x="414" y="379" width="250" height="64" rx="8"/>
  <text class="label ink" x="539" y="418" text-anchor="middle">Probabilities</text>
</svg>
